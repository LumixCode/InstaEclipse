plugins {
    alias(libs.plugins.android.application)
}

// Release signing secrets live outside git (see .gitignore); keys: storeFile, storePassword, keyAlias, keyPassword.
def releaseKeystoreFile = rootProject.file('keystore.properties')
def releaseKeystore = new Properties()
if (releaseKeystoreFile.exists()) releaseKeystoreFile.withInputStream { releaseKeystore.load(it) }

android {
    namespace 'ps.reso.instaeclipse'
    compileSdk 34
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId "ps.reso.instaeclipse"
        minSdkVersion 28
        targetSdk 36
        // The fork's release workflow passes -PforkVersionCode/-PforkVersionName; other builds keep upstream's version.
        versionCode project.findProperty('forkVersionCode')?.toInteger() ?: 20
        versionName project.findProperty('forkVersionName') ?: '0.8.2'

        resourceConfigurations += ['en', 'ar', 'az', 'de', 'el', 'es', 'fr', 'he', 'in', 'it', 'iw', 'pl', 'pt', 'ru', 'sv', 'tr', 'vi', 'zh-rCN', 'zh-rTW']

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (releaseKeystoreFile.exists()) {
                storeFile file(releaseKeystore['storeFile'])
                storePassword releaseKeystore['storePassword']
                keyAlias releaseKeystore['keyAlias']
                keyPassword releaseKeystore['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Without keystore.properties, fall back to the debug key: the APK can't be published,
            // but it still installs over an existing debug build, so module settings survive.
            signingConfig releaseKeystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        error 'MissingQuantity', 'UnusedQuantity'
        fatal 'NewApi'
    }
    packaging {
        resources {
            excludes += ['/kotlin/**', '/DebugProbesKt.bin', '/META-INF/*.version', '/META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // Core Android dependencies
    implementation libs.appcompat
    implementation libs.material
    implementation libs.gson
    implementation libs.dexkit
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation libs.osmdroid

    // Xposed APIs, provided by the framework at runtime. The module loads through libxposed API 102
    // (META-INF/xposed: Vector 2.2+, LSPatch 1.0+); the legacy API stays behind the compat layer.
    // See docs/xposed-api-102.
    compileOnly files('libs/api-82.jar')
    compileOnly 'io.github.libxposed:api:102.0.0'
    // Lets the companion write remote preferences that the hooked app reads. The classes of io.github.libxposed:service/interface 102.0.0 (Apache-2.0), used as jars: the
    // AARs declare minCompileSdk 37, which this project's AGP/compileSdk 34 doesn't meet; their
    // XposedProvider is declared in AndroidManifest.xml.
    implementation files('libs/modern/libxposed-service-102.0.0.jar', 'libs/modern/libxposed-interface-102.0.0.jar')
}
