name: Bug Report
description: Report a bug or broken feature in this fork
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for the LumixCode fork of InstaEclipse. If the problem also happens with the official InstaEclipse release, please report it to [the upstream project](https://github.com/ReSo7200/InstaEclipse/issues) instead.

        Please fill in every field. Issues without them may be closed.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checklist
      description: Check every box before submitting.
      options:
        - label: I am using a build of **this fork**, not the official InstaEclipse release.
          required: true
        - label: I have searched [existing issues](https://github.com/LumixCode/InstaEclipse/issues) and this is **not a duplicate**.
          required: true
        - label: I am using Instagram from **APKMirror**, not the Google Play Store.
          required: true
        - label: I have tried **disabling and re-enabling** the module in LSPatch or Vector and force-stopping Instagram.
          required: true
        - label: I have read the [FAQ](https://github.com/LumixCode/InstaEclipse#faq) and my issue is not covered there.
          required: true

  - type: input
    id: instaeclipse_version
    attributes:
      label: InstaEclipse version and fork commit
      description: The version shown in the companion app, and the commit you built from if you know it.
      placeholder: e.g. 0.8.2-debug, built from commit abc1234
    validations:
      required: true

  - type: input
    id: instagram_version
    attributes:
      label: Instagram version
      placeholder: e.g. 451.0.0.20.80 (from APKMirror)
    validations:
      required: true

  - type: dropdown
    id: root_method
    attributes:
      label: Setup method
      description: This fork is built for the new Xposed API (102) only.
      options:
        - "No root: LSPatch (JingMatrix) 1.0 or newer"
        - "Root: Vector (JingMatrix) 2.2 or newer"
        - "Other (say which in the description)"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you expect to happen, and what actually happened?
      placeholder: When I try to ... it does ... instead of ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Instagram
        2. Long-press the Explore (search) tab
        3. Enable ...
        4. See ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (if available)
      description: Paste the relevant lines from the companion app's Logs screen, or from LSPatch or Vector. Remove usernames, chat names and message text first, since issues are public.
      render: text
