name: Feature Request
description: Suggest a new feature or improvement for this fork
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for the LumixCode fork of InstaEclipse. Ideas for the official release belong in [the upstream project](https://github.com/ReSo7200/InstaEclipse/issues).

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checklist
      description: Check every box before submitting.
      options:
        - label: I have searched [existing issues](https://github.com/LumixCode/InstaEclipse/issues) and this feature has **not already been requested**.
          required: true
        - label: I have checked the [feature list](https://github.com/LumixCode/InstaEclipse#features) and this fork doesn't have it yet.
          required: true
        - label: This is a feature request for **InstaEclipse**, not a general Instagram feature.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Feature summary
      description: Describe the feature you'd like in one or two sentences.
      placeholder: I'd like InstaEclipse to be able to ...
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
      description: Explain the use case. Why would this benefit users?
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Any implementation ideas, screenshots, or references to similar features in other mods.
