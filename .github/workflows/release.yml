name: Release

# Builds, signs and publishes the APK as a GitHub release, numbered by .github/scripts/release-version.sh.
# Start it from the Actions tab, or with: gh workflow run release.yml -R LumixCode/InstaEclipse
#
# The build job runs Gradle (and with it every plugin and dependency) without the signing key. Only the
# publish job, which runs no build code, gets the key from the repository secrets and signs the APK with
# apksigner. Actions are pinned to commit SHAs because the publish job holds the key and write access.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Extra text for the top of the release notes
        required: false
        default: ''
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false
      dry_run:
        description: Build and sign only, and upload the APK and notes as a workflow artifact (no tag, no release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUILD_TOOLS: '34.0.0'

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.version.outputs.base }}
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      previous: ${{ steps.version.outputs.previous }}
      upstream_base: ${{ steps.version.outputs.upstream_base }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install the Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS" > /dev/null'

      - name: Work out the version
        id: version
        run: |
          bash .github/scripts/release-version.sh | tee -a "$GITHUB_OUTPUT"
          git fetch --quiet https://github.com/ReSo7200/InstaEclipse.git main
          echo "upstream_base=$(git merge-base HEAD FETCH_HEAD)" | tee -a "$GITHUB_OUTPUT"

      - name: Stop when nothing changed since the last release
        if: ${{ !inputs.dry_run && steps.version.outputs.previous != '' }}
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          if [ "$(git rev-parse "$PREVIOUS^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "::error::main is still at $PREVIOUS, so there is nothing new to release"
            exit 1
          fi

      - name: Run the unit tests and build the release APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleRelease -PforkVersionName="$VERSION" -PforkVersionCode="$CODE"

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Download the APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-build
          path: build-output

      - name: Install the Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS" > /dev/null'

      - name: Sign and check the APK
        id: apk
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION: ${{ needs.build.outputs.version }}
          CODE: ${{ needs.build.outputs.code }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_* signing secrets are missing"
            exit 1
          fi
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          unsigned=$(ls build-output/*.apk | head -n1)
          out="InstaEclipse-$VERSION.apk"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$out" "$unsigned"
          rm -f "$RUNNER_TEMP/release.jks"
          "$tools/apksigner" verify --print-certs "$out" > certs.txt
          if [ "$(grep -c '^Signer #' certs.txt)" = 0 ] || grep -q 'CN=Android Debug' certs.txt; then
            echo "::error::The APK is not signed with the release key"
            exit 1
          fi
          badging=$("$tools/aapt" dump badging "$out" | head -n1)
          echo "$badging"
          grep -q "versionCode='$CODE' versionName='$VERSION'" <<<"$badging"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "cert=$(sed -nE 's/^Signer #1 certificate SHA-256 digest: //p' certs.txt)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$out" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          BASE: ${{ needs.build.outputs.base }}
          TAG: ${{ needs.build.outputs.tag }}
          PREVIOUS: ${{ needs.build.outputs.previous }}
          UPSTREAM_BASE: ${{ needs.build.outputs.upstream_base }}
          CERT_SHA256: ${{ steps.apk.outputs.cert }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
          EXTRA_NOTES: ${{ inputs.notes }}
          FORK_EMAIL: LumixCode@users.noreply.github.com
        run: |
          python3 .github/scripts/release_notes.py > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the dry run
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run-${{ needs.build.outputs.version }}
          path: |
            ${{ steps.apk.outputs.file }}
            notes.md

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          FILE: ${{ steps.apk.outputs.file }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --title "InstaEclipse $VERSION" \
            --notes-file notes.md "${flags[@]}"
